# Copy to .streamlit/secrets.toml (local) or paste into the app's "Secrets" panel on
# Streamlit Community Cloud. NEVER commit the real file.

# ---- Demo mode (recommended for any PUBLIC deployment) ----
# true  = no real Google Calendar reads/writes, no real emails, no Drive uploads. Interviewer
#         calendars are simulated and emails are previewed on screen. In this mode only
#         GEMINI_API_KEY, BOOKING_APP_URL and gcp_service_account (for the demo sheet) are needed.
# false = full production behaviour (default).
DEMO_MODE = false

# ---- Required: HR dashboard (app.py) ----
GEMINI_API_KEY = "your-gemini-api-key"
SENDER_EMAIL = "your.recruiting.mailbox@gmail.com"
GMAIL_APP_PASSWORD = "16-character-gmail-app-password"   # Google Account > Security > App passwords

# Deployment URL of the candidate booking page (streamlit_app.py); used in interview-invite emails
BOOKING_APP_URL = "https://your-booking-app.streamlit.app/"

# Apps Script web-app URL for resume uploads (see apps_script/Code.gs). Optional: without it,
# resumes are still scored but are not stored in Drive.
APPS_SCRIPT_URL = "https://script.google.com/macros/s/XXXXXXXX/exec"

# ---- Required: scheduling (streamlit_app.py) ----
# Calendars whose free/busy time decides which slots are offered (at least 2)
INTERVIEWER_EMAILS = ["interviewer.one@example.com", "interviewer.two@example.com"]

# ---- Optional branding / config ----
# COMPANY_NAME = "Acme Technology Ltd."
# CONTACT_PHONE = "555-0100"
# SHEET_NAME = "HR Applicant Tracker"

# ---- Google credentials (paste the JSON as a multi-line string) ----
gcp_service_account = '''
{ ...contents of the service-account key JSON... }
'''
google_calendar_token = '''
{ ...contents of token.json produced by the local OAuth flow... }
'''
